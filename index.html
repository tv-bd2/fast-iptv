<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fast IPTV</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06080d;
  --card:#0d1119;
  --card2:#111820;
  --border:#1c2433;
  --red:#e8003a;
  --red2:#ff1a4f;
  --text:#f0f4ff;
  --muted:#6a7a91;
  --glow:rgba(232,0,58,.18);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
/* grain overlay */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
  pointer-events:none;
  z-index:0;
  opacity:.5;
}

header{
  padding:14px 24px;
  border-bottom:1px solid var(--border);
  background:rgba(6,8,13,.92);
  position:relative;
  z-index:1;
  backdrop-filter:blur(12px);
  display:flex;
  align-items:center;
  gap:16px;
}
.logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:30px;
  letter-spacing:2px;
  line-height:1;
}
.logo span{color:var(--red);}
.live-badge{
  background:var(--red);
  color:#fff;
  font-size:10px;
  font-weight:700;
  letter-spacing:1.5px;
  padding:3px 8px;
  border-radius:4px;
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.6;}}

main{
  display:grid;
  grid-template-columns:1fr 360px;
  gap:0;
  padding:0;
  position:relative;
  z-index:1;
}

/* PLAYER SIDE */
.player-section{
  padding:20px;
  position:sticky;
  top:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  gap:12px;
  overflow:hidden;
}
.player-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    overflow:hidden;
}

#jwplayer{
    position:absolute;
    top:0;
    left:0;
    width:100% !important;
    height:100% !important;
}

.jwplayer{
    width:100% !important;
    height:100% !important;
}

.jw-video{
    object-fit:contain !important;
}
.player-wrap{
  width:100%;
  position:relative;
  background:#000;
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--border);
  box-shadow:0 0 40px rgba(0,0,0,.6);
}
.player-wrap::before{
  content:'';
  display:block;
  padding-bottom:56.25%;
}
.player-wrap > *{
  position:absolute;
  top:0;left:0;width:100%;height:100%;
}
video{width:100%;height:100%;background:#000;outline:none;}

.loading{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#000;
  flex-direction:column;
  gap:12px;
  z-index:10;
}
.loading-spinner{
  width:36px;height:36px;
  border:3px solid var(--border);
  border-top-color:var(--red);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{color:var(--muted);font-size:13px;letter-spacing:.5px;}

.channel-overlay{
  position:absolute;top:16px;left:16px;
  background:transparent;
  color:#fff;padding:12px 18px;border-radius:10px;
  z-index:999;display:none;min-width:200px;
}
#channelNumber{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--red);line-height:1;}
#channelName{font-size:14px;margin-top:4px;color:rgba(255,255,255,.8);}

.status-bar{
  padding:10px 14px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  font-size:13px;
  color:var(--muted);
  display:flex;align-items:center;gap:8px;
  flex-shrink:0;
}
.status-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--muted);flex-shrink:0;
}
.status-dot.playing{background:#00e87a;box-shadow:0 0 6px #00e87a;}
.status-dot.buffering{background:#ffb700;box-shadow:0 0 6px #ffb700;animation:pulse 1s infinite;}
.status-dot.error{background:var(--red);}

.controls{
  display:flex;flex-wrap:wrap;gap:8px;flex-shrink:0;
}
.control-btn{
  flex:1;min-width:80px;
  padding:10px 8px;border:none;border-radius:10px;cursor:pointer;
  background:var(--card);
  border:1px solid var(--border);
  color:var(--text);font-weight:600;font-size:13px;
  font-family:'DM Sans',sans-serif;
  transition:background .15s,border-color .15s,transform .1s;
}
.control-btn:hover{background:var(--red);border-color:var(--red);}
.control-btn:active{transform:scale(.97);}

/* SIDEBAR */
.sidebar{
  border-left:1px solid var(--border);
  height:100vh;
  position:sticky;
  top:0;
  display:flex;flex-direction:column;
  background:var(--card);
  overflow:hidden;
}

.sidebar-top{
  padding:16px;
  border-bottom:1px solid var(--border);
  display:flex;flex-direction:column;gap:10px;
  flex-shrink:0;
}

.search-wrap{position:relative;}
.search-wrap::before{
  content:'⌕';
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:18px;pointer-events:none;
}
.search-wrap input{
  width:100%;
  padding:10px 12px 10px 36px;
  border:none;border-radius:10px;
  background:var(--card2);
  border:1px solid var(--border);
  color:var(--text);outline:none;
  font-family:'DM Sans',sans-serif;font-size:14px;
  transition:border-color .2s;
}
.search-wrap input:focus{border-color:var(--red);}
.search-wrap input::placeholder{color:var(--muted);}

.category-wrap{
  display:flex;overflow-x:auto;gap:6px;
  scrollbar-width:thin;
  scrollbar-color:var(--red) var(--border);
  padding-bottom:6px;
}
.category-wrap::-webkit-scrollbar{height:4px;display:block;}
.category-wrap::-webkit-scrollbar-track{background:var(--border);border-radius:4px;}
.category-wrap::-webkit-scrollbar-thumb{background:var(--red);border-radius:4px;}
.category-btn{
  border:none;
  background:var(--card2);
  border:1px solid var(--border);
  color:var(--muted);
  padding:6px 14px;border-radius:20px;
  cursor:pointer;white-space:nowrap;
  font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;
  transition:background .15s,color .15s,border-color .15s;
  flex-shrink:0;
}
.category-btn:hover{color:var(--text);}
.category-btn.active{background:var(--red);border-color:var(--red);color:#fff;}

.channel-count{
  font-size:11px;color:var(--muted);
  padding:0 16px;padding-bottom:8px;flex-shrink:0;
  border-bottom:1px solid var(--border);
}

.channel-list{
  overflow-y:auto;flex:1;padding:10px;
  scrollbar-width:thin;
  scrollbar-color:var(--border) transparent;
}
.channel-list::-webkit-scrollbar{width:4px;}
.channel-list::-webkit-scrollbar-track{background:transparent;}
.channel-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

.channel{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:10px;
  background:var(--card2);
  border:1px solid transparent;
  margin-bottom:6px;cursor:pointer;
  transition:border-color .2s,background .2s,transform .1s;
}
.channel:hover{border-color:rgba(232,0,58,.4);background:#131b26;}
.channel:active{transform:scale(.99);}
.channel.active{
  border-color:var(--red);
  background:rgba(232,0,58,.08);
  box-shadow:0 0 0 1px var(--glow) inset;
}
.ch-logo-wrap{
  width:48px;height:48px;flex-shrink:0;
  background:#fff;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;padding:3px;
}
.channel img{width:42px;height:42px;object-fit:contain;}
.channel-info{flex:1;min-width:0;}
.channel-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.channel-category{
  color:var(--muted);font-size:11px;margin-top:2px;
}
.ch-num{
  font-family:'Bebas Neue',sans-serif;
  font-size:16px;color:var(--border);
  flex-shrink:0;
}
.channel.active .ch-num{color:var(--red);}

/* RESPONSIVE */
@media(max-width:900px){
  main{display:block;}
  .player-section{
    position:relative;top:0;
    height:auto;
  }
  .sidebar{
    position:relative;top:0;
    height:auto;
    border-left:none;border-top:1px solid var(--border);
  }
  .channel-list{max-height:60vh;}
}

/* FULLSCREEN */
.player-wrap:fullscreen,
.player-wrap:-webkit-full-screen,
.player-wrap:-ms-fullscreen{
  width:100%;height:100%;border-radius:0;
}
.player-wrap:fullscreen::before,
.player-wrap:-webkit-full-screen::before,
.player-wrap:-ms-fullscreen::before{display:none;}
.player-wrap:fullscreen > *,
.player-wrap:-webkit-full-screen > *,
.player-wrap:-ms-fullscreen > *{position:absolute;top:0;left:0;width:100%;height:100%;}
.player-wrap:fullscreen .channel-overlay,
.player-wrap:-webkit-full-screen .channel-overlay,
.player-wrap:-ms-fullscreen .channel-overlay{position:fixed;top:20px;left:20px;z-index:2147483647;}
</style>

  </aside>
</main>

// ─── APP STATE ────────────────────────────────────────────────────────────────
var currentCategory = "All";
var currentChannel = null;
var currentIndex = 0;
var overlayTimer = null;
var numberInput = "";
var numberTimer = null;
var jwPlayerInstance = null;

// ─── DOM REFS ────────────────────────────────────────────────────────────────
var elChannelList = document.getElementById("channelList");
var elSearch      = document.getElementById("search");
var elStatus      = document.getElementById("status");
var elStatusDot   = document.getElementById("statusDot");
var elLoading     = document.getElementById("loading");
var elSection     = document.getElementById("playerSection");
var elCount       = document.getElementById("channelCount");

// ─── HELPERS ──────────────────────────────────────────────────────────────────
if (!Array.prototype.findIndex) {
  Array.prototype.findIndex = function(fn) {
    for (var i = 0; i < this.length; i++) if (fn(this[i], i, this)) return i;
    return -1;
  };
}
if (!Array.prototype.find) {
  Array.prototype.find = function(fn) {
    for (var i = 0; i < this.length; i++) if (fn(this[i], i, this)) return this[i];
  };
}

function setStatus(text, type) {
  elStatus.textContent = text;
  elStatusDot.className = "status-dot" + (type ? " " + type : "");
}

function getFiltered() {
  var kw = elSearch.value.toLowerCase();
  return channels.filter(function(ch) {
    return (currentCategory === "All" || ch.category === currentCategory)
        && ch.name.toLowerCase().indexOf(kw) !== -1;
  });
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function renderChannels() {
  var filtered = getFiltered();
  elCount.textContent = filtered.length + " channel" + (filtered.length !== 1 ? "s" : "");
  elChannelList.innerHTML = "";
  for (var i = 0; i < filtered.length; i++) {
    (function(ch, idx) {
      var div = document.createElement("div");
      div.className = "channel" + (currentChannel === ch.id ? " active" : "");
      div.innerHTML =
        '<div class="ch-logo-wrap"><img src="' + ch.logo + '" alt="" onerror="this.src=\'data:image/svg+xml,<svg xmlns=\\\'http://www.w3.org/2000/svg\\\' viewBox=\\\'0 0 48 48\\\'><rect width=\\\'48\\\' height=\\\'48\\\' fill=\\\'%23222\\\'/><text x=\\\'50%25\\\' y=\\\'55%25\\\' text-anchor=\\\'middle\\\' dominant-baseline=\\\'middle\\\' fill=\\\'%23666\\\' font-size=\\\'10\\\'>TV</text></svg>\'"></div>' +
        '<div class="channel-info">' +
          '<div class="channel-name">' + ch.name + '</div>' +
          '<div class="channel-category">' + ch.category + '</div>' +
        '</div>' +
        '<div class="ch-num">' + (idx + 1) + '</div>';
      div.onclick = function() { playChannel(ch); };
      elChannelList.appendChild(div);
    })(filtered[i], i);
  }
}

// ─── PLAY ─────────────────────────────────────────────────────────────────────
function playChannel(channel) {

  currentChannel = channel.id;

  var filtered = getFiltered();

  currentIndex = filtered.findIndex(function(c){
    return c.id === channel.id;
  });

  renderChannels();
  showOverlay(channel);

  setStatus("Loading: " + channel.name, "buffering");
  elLoading.style.display = "flex";

  jwplayer("jwplayer").remove();

  jwPlayerInstance = jwplayer("jwplayer");

  jwPlayerInstance.setup({
      file: channel.url,
      autostart: true,
      mute: false,
      width: "100%",
      height: "100%",
      stretching: "uniform",
      hlshtml: true
  });

  jwPlayerInstance.on("ready", function() {
      elLoading.style.display = "none";
      setStatus("Playing: " + channel.name, "playing");
  });

  jwPlayerInstance.on("play", function() {
      elLoading.style.display = "none";
      setStatus("Playing: " + channel.name, "playing");
  });

  jwPlayerInstance.on("buffer", function() {
      setStatus("Buffering: " + channel.name, "buffering");
  });

  jwPlayerInstance.on("error", function() {
      elLoading.style.display = "none";
      setStatus("Playback Error", "error");
  });

  if (window.innerWidth <= 900) {
      try {
          elSection.scrollIntoView({behavior:"smooth"});
      } catch(e) {
          elSection.scrollIntoView();
      }
  }
}

// ─── NAV ──────────────────────────────────────────────────────────────────────
function nextChannel() {
  var f = getFiltered();
  if (!f.length) return;
  currentIndex = (currentIndex + 1) % f.length;
  playChannel(f[currentIndex]);
}
function previousChannel() {
  var f = getFiltered();
  if (!f.length) return;
  currentIndex = (currentIndex - 1 + f.length) % f.length;
  playChannel(f[currentIndex]);
}

// ─── OVERLAY ──────────────────────────────────────────────────────────────────
function showOverlay(channel) {
  var f = getFiltered();
  var n = f.findIndex(function(c) { return c.id === channel.id; }) + 1;
  document.getElementById("channelNumber").textContent = n;
  document.getElementById("channelName").textContent = channel.name;
  var ov = document.getElementById("channelOverlay");
  ov.style.display = "block";
  clearTimeout(overlayTimer);
  overlayTimer = setTimeout(function() { ov.style.display = "none"; }, 3000);
}

// ─── CATEGORY + SEARCH ────────────────────────────────────────────────────────
function filterCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll(".category-btn").forEach(function(b) {
    b.className = "category-btn" + (b.textContent.trim().toLowerCase() === cat.toLowerCase() || (cat === "Infotainment" && b.textContent.trim() === "Info") ? " active" : "");
  });
  renderChannels();
}
elSearch.addEventListener("input", renderChannels);

// ─── FULLSCREEN ───────────────────────────────────────────────────────────────
function toggleFullscreen() {
  var p = document.querySelector(".player-wrap");
  var isFs = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
  if (!isFs) {
    (p.requestFullscreen || p.webkitRequestFullscreen || p.mozRequestFullScreen || p.msRequestFullscreen).call(p);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen).call(document);
  }
}

// ─── RELOAD ───────────────────────────────────────────────────────────────────
function reloadPlayer() {

  if (!currentChannel) return;

  var ch = channels.find(function(c){
      return c.id === currentChannel;
  });

  if (ch) {
      playChannel(ch);
  }
}

// ─── KEYBOARD ─────────────────────────────────────────────────────────────────
document.addEventListener("keydown", function(e) {
  var k = e.key || e.keyCode;
  if (k === "ArrowRight" || k === 39 || k === "MediaTrackNext")    { nextChannel(); return; }
  if (k === "ArrowLeft"  || k === 37 || k === "MediaTrackPrevious") { previousChannel(); return; }
  if (k === "f" || k === "F") { toggleFullscreen(); return; }
  var s = (typeof k === "string") ? k : String.fromCharCode(k);
  if (/^[0-9]$/.test(s)) {
    numberInput += s;
    setStatus("Channel: " + numberInput, "");
    clearTimeout(numberTimer);
    numberTimer = setTimeout(function() {
      var n = parseInt(numberInput, 10);
      var f = getFiltered();
      if (n > 0 && n <= f.length) playChannel(f[n - 1]);
      numberInput = "";
    }, 1500);
  }
});

// ─── CATEGORY HORIZONTAL SCROLL ─────────────────────────────────────────────
var catWrap = document.querySelector(".category-wrap");
catWrap.addEventListener("wheel", function(e) {
  if (e.deltaY !== 0) {
    e.preventDefault();
    catWrap.scrollLeft += e.deltaY;
  }
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
renderChannels();
if (channels.length > 0) playChannel(channels[0]);
</script>
